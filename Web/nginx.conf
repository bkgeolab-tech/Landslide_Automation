server {
    listen       80;
    server_name  localhost;

    # Phục vụ các file tĩnh của React App
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Hỗ trợ React Router: nếu không tìm thấy file, fallback về index.html
        try_files $uri $uri/ /index.html;
    }

    # Bỏ qua logs cho favicon và robots
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Tùy chọn Proxy: Nếu bạn muốn gọi API bằng relative path (như /api/realtime/run thay vì http://domain.com/api/...)
    # location /api/ {
    #     proxy_pass http://api:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # Xử lý các trang lỗi chung
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
